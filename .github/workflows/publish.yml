name: Publish to PyPI

# Publish a new distribution to PyPI only for stable CalVer release tags of the
# form YYYY.M.D (e.g. 2026.9.14, the project's tagging convention).
# The glob below is intentionally permissive; a guard step then rejects anything
# that is not a strict 4-digit-year.month.day tag so a mistyped tag never
# reaches PyPI.
#
# Uses Trusted Publishing (OIDC) so no API token secret is stored in the repo;
# the publisher must already be configured on the PyPI project
# (Settings -> Publishing -> Trusted publishers) for this repo+workflow.

on:
  push:
    tags:
      - "*.*.*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history so hatch-vcs can derive the version from git.
          fetch-depth: 0

      - name: Validate stable tag
        run: |
          tag="$GITHUB_REF_NAME"
          # CalVer: 4-digit year, month 1-12, day 1-31 (leading zeros optional).
          if ! [[ "$tag" =~ ^[0-9]{4}\.(0?[1-9]|1[0-2])\.(0?[1-9]|[12][0-9]|3[01])$ ]]; then
            echo "::error::Ref $GITHUB_REF_NAME is not a stable YYYY.M.D release tag; aborting."
            exit 1
          fi
          echo "Publishing stable release $tag"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Show built artifacts
        run: ls -lh dist/

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
